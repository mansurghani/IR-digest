name: IR Weekly Digest

on:
  schedule:
    - cron: '0 15 * * 1'  # Mondays 15:00 UTC = 11am Eastern / 8am Pacific (10am / 7am in winter)
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send ONLY to this address (test run, PMID history not updated). Leave blank to send to all subscribers.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run digest script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: python ir_digest.py
